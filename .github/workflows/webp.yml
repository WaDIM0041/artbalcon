name: webp
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  webp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert images to WebP
        run: |
          python3 -m pip install --quiet pillow
          python3 -c "from pathlib import Path;from PIL import Image;[Image.open(p).convert('RGB').save(p.with_suffix('.webp'),'WEBP',quality=82,method=6) for p in Path('images').glob('*.jpg')]"
          sed -i 's/\.jpg"/.webp"/g' index.html
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html images
          git commit -m "chore: convert images to webp" || echo "no changes"
          git push
