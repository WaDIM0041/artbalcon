<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Облака">
  <style>
    .cl{animation:drift linear infinite alternate}
    .c1{animation-duration:95s}.c2{animation-duration:130s}.c3{animation-duration:75s}
    .c4{animation-duration:150s}.c5{animation-duration:110s}.c6{animation-duration:85s}
    @keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(140px)}}
  </style>
  <defs>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="30"/></filter>
    <g id="cloud">
      <ellipse cx="0" cy="0" rx="120" ry="42"/>
      <ellipse cx="-80" cy="12" rx="70" ry="28"/>
      <ellipse cx="80" cy="14" rx="80" ry="30"/>
      <ellipse cx="10" cy="-24" rx="70" ry="30"/>
      <ellipse cx="-30" cy="-12" rx="60" ry="26"/>
    </g>
  </defs>
  <g transform="translate(280,170) scale(1.15)"><use href="#cloud" class="cl c1" fill="#ffffff" opacity="0.8" filter="url(#soft)"/></g>
  <g transform="translate(760,110) scale(0.75)"><use href="#cloud" class="cl c2" fill="#ffffff" opacity="0.5" filter="url(#soft2)"/></g>
  <g transform="translate(1180,200) scale(1.3)"><use href="#cloud" class="cl c3" fill="#ffffff" opacity="0.85" filter="url(#soft)"/></g>
  <g transform="translate(1480,120) scale(0.6)"><use href="#cloud" class="cl c4" fill="#ffffff" opacity="0.4" filter="url(#soft2)"/></g>
  <g transform="translate(950,300) scale(0.9)"><use href="#cloud" class="cl c5" fill="#ffffff" opacity="0.55" filter="url(#soft)"/></g>
  <g transform="translate(60,260) scale(0.7)"><use href="#cloud" class="cl c6" fill="#ffffff" opacity="0.45" filter="url(#soft2)"/></g>
</svg>
